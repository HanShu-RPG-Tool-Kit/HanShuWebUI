<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" role="img" aria-label="冲突：注入点重复">
  <title>冲突：注入点重复</title>
  <!-- 两个中空方框沿对角线错开重叠 -->
  <g stroke="#e05252" stroke-width="1.2" stroke-linejoin="round">
    <rect x="0.65" y="0.65" width="10.7" height="10.7" rx="1.6"/>
    <rect x="4.65" y="4.65" width="10.7" height="10.7" rx="1.6"/>
  </g>
  <!--
    重叠部分（4.65..11.35）实心；中央的中空感叹号是 evenodd 挖出来的**孔**，
    孔里透出的是编辑器底色，因此深浅主题都不用换色。
  -->
  <path
    fill="#e05252"
    fill-rule="evenodd"
    d="M4.65 4.65H11.35V11.35H4.65Z M6.8 6.5A1.2 1.2 0 0 1 9.2 6.5V6.85A1.2 1.2 0 0 1 6.8 6.85Z M8 8.65A1.05 1.05 0 1 0 8 10.75A1.05 1.05 0 1 0 8 8.65Z"
  />
</svg>