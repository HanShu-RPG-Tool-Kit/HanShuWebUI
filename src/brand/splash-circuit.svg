<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!--
    Structured PCB tile (inspired by common tech UI circuit backgrounds):
    - regular via grid
    - orthogonal buses / L-routes
    - rectangular IC footprints with pin stubs
    Hairline cool gray only.
  -->
  <style>
    .pcb-bus, .pcb-route, .pcb-pin {
      fill: none;
      stroke: #e8eaed;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .pcb-bus { stroke-width: 0.7; }
    .pcb-route { stroke-width: 0.65; }
    .pcb-pin { stroke-width: 0.6; }
    .pcb-chip {
      fill: none;
      stroke: #e5e7eb;
      stroke-width: 0.7;
    }
    .pcb-via {
      fill: #eef0f3;
      stroke: #e5e7eb;
      stroke-width: 0.55;
    }
    .pcb-pulse {
      fill: none;
      stroke: #dde1e6;
      stroke-width: 0.7;
      stroke-linecap: square;
      stroke-dasharray: 6 54;
      animation: pcb-pulse 11s linear infinite;
    }
    .pcb-pulse:nth-of-type(2) {
      animation-duration: 14s;
      animation-direction: reverse;
      stroke-dasharray: 5 62;
    }
    .pcb-pulse:nth-of-type(3) {
      animation-duration: 17s;
      stroke-dasharray: 4 70;
    }
    @keyframes pcb-pulse {
      to { stroke-dashoffset: -120; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pcb-pulse { animation: none; stroke-dasharray: none; }
    }
  </style>
  <defs>
    <g id="hanshu-pcb-cell">
      <!-- Regular via lattice (8×5) -->
      <g class="pcb-vias">
        <circle class="pcb-via" cx="20" cy="20" r="1.35"/>
        <circle class="pcb-via" cx="60" cy="20" r="1.35"/>
        <circle class="pcb-via" cx="100" cy="20" r="1.35"/>
        <circle class="pcb-via" cx="140" cy="20" r="1.35"/>
        <circle class="pcb-via" cx="180" cy="20" r="1.35"/>
        <circle class="pcb-via" cx="220" cy="20" r="1.35"/>
        <circle class="pcb-via" cx="260" cy="20" r="1.35"/>
        <circle class="pcb-via" cx="300" cy="20" r="1.35"/>

        <circle class="pcb-via" cx="20" cy="60" r="1.35"/>
        <circle class="pcb-via" cx="60" cy="60" r="1.35"/>
        <circle class="pcb-via" cx="100" cy="60" r="1.35"/>
        <circle class="pcb-via" cx="140" cy="60" r="1.35"/>
        <circle class="pcb-via" cx="180" cy="60" r="1.35"/>
        <circle class="pcb-via" cx="220" cy="60" r="1.35"/>
        <circle class="pcb-via" cx="260" cy="60" r="1.35"/>
        <circle class="pcb-via" cx="300" cy="60" r="1.35"/>

        <circle class="pcb-via" cx="20" cy="100" r="1.35"/>
        <circle class="pcb-via" cx="60" cy="100" r="1.35"/>
        <circle class="pcb-via" cx="100" cy="100" r="1.35"/>
        <circle class="pcb-via" cx="140" cy="100" r="1.35"/>
        <circle class="pcb-via" cx="180" cy="100" r="1.35"/>
        <circle class="pcb-via" cx="220" cy="100" r="1.35"/>
        <circle class="pcb-via" cx="260" cy="100" r="1.35"/>
        <circle class="pcb-via" cx="300" cy="100" r="1.35"/>

        <circle class="pcb-via" cx="20" cy="140" r="1.35"/>
        <circle class="pcb-via" cx="60" cy="140" r="1.35"/>
        <circle class="pcb-via" cx="100" cy="140" r="1.35"/>
        <circle class="pcb-via" cx="140" cy="140" r="1.35"/>
        <circle class="pcb-via" cx="180" cy="140" r="1.35"/>
        <circle class="pcb-via" cx="220" cy="140" r="1.35"/>
        <circle class="pcb-via" cx="260" cy="140" r="1.35"/>
        <circle class="pcb-via" cx="300" cy="140" r="1.35"/>

        <circle class="pcb-via" cx="20" cy="180" r="1.35"/>
        <circle class="pcb-via" cx="60" cy="180" r="1.35"/>
        <circle class="pcb-via" cx="100" cy="180" r="1.35"/>
        <circle class="pcb-via" cx="140" cy="180" r="1.35"/>
        <circle class="pcb-via" cx="180" cy="180" r="1.35"/>
        <circle class="pcb-via" cx="220" cy="180" r="1.35"/>
        <circle class="pcb-via" cx="260" cy="180" r="1.35"/>
        <circle class="pcb-via" cx="300" cy="180" r="1.35"/>
      </g>

      <!-- Horizontal / vertical buses on the lattice -->
      <path class="pcb-bus" d="M20 20H140"/>
      <path class="pcb-bus" d="M180 20H300"/>
      <path class="pcb-bus" d="M20 100H100"/>
      <path class="pcb-bus" d="M220 100H300"/>
      <path class="pcb-bus" d="M60 180H180"/>
      <path class="pcb-bus" d="M20 20V100"/>
      <path class="pcb-bus" d="M300 20V100"/>
      <path class="pcb-bus" d="M60 100V180"/>
      <path class="pcb-bus" d="M260 60V180"/>

      <!-- Orthogonal L-routes between chips and lattice -->
      <path class="pcb-route" d="M100 60H140V100"/>
      <path class="pcb-route" d="M180 60H220V100"/>
      <path class="pcb-route" d="M100 140H140V180"/>
      <path class="pcb-route" d="M180 140V100H220"/>
      <path class="pcb-route" d="M220 140H260"/>
      <path class="pcb-route" d="M60 60V100H20"/>

      <!-- IC footprint A (top-leftish) -->
      <rect class="pcb-chip" x="72" y="44" width="56" height="32" rx="1"/>
      <path class="pcb-pin" d="M80 44V36"/>
      <path class="pcb-pin" d="M92 44V36"/>
      <path class="pcb-pin" d="M104 44V36"/>
      <path class="pcb-pin" d="M116 44V36"/>
      <path class="pcb-pin" d="M80 76V84"/>
      <path class="pcb-pin" d="M92 76V84"/>
      <path class="pcb-pin" d="M104 76V84"/>
      <path class="pcb-pin" d="M116 76V84"/>

      <!-- IC footprint B (right) -->
      <rect class="pcb-chip" x="232" y="84" width="40" height="48" rx="1"/>
      <path class="pcb-pin" d="M232 96H224"/>
      <path class="pcb-pin" d="M232 108H224"/>
      <path class="pcb-pin" d="M232 120H224"/>
      <path class="pcb-pin" d="M272 96H280"/>
      <path class="pcb-pin" d="M272 108H280"/>
      <path class="pcb-pin" d="M272 120H280"/>

      <!-- Signal pulses along a few main buses only -->
      <path class="pcb-pulse" d="M20 20H140"/>
      <path class="pcb-pulse" d="M300 20V100H220"/>
      <path class="pcb-pulse" d="M60 100V180H180"/>
    </g>
  </defs>

  <use href="#hanshu-pcb-cell" x="0" y="0"/>
  <use href="#hanshu-pcb-cell" x="320" y="0"/>
  <use href="#hanshu-pcb-cell" x="640" y="0"/>
  <use href="#hanshu-pcb-cell" x="0" y="200"/>
  <use href="#hanshu-pcb-cell" x="320" y="200"/>
  <use href="#hanshu-pcb-cell" x="640" y="200"/>
  <use href="#hanshu-pcb-cell" x="0" y="400"/>
  <use href="#hanshu-pcb-cell" x="320" y="400"/>
  <use href="#hanshu-pcb-cell" x="640" y="400"/>
</svg>
