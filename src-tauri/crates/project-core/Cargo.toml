[package]
name = "project-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
tempfile = "3"
fs4 = "1.1"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3"
