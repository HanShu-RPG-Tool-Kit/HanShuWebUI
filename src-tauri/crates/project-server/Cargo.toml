[package]
name = "project-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
project-core = { path = "../project-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

