<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const ease = t => {t=clamp(t);return 1-Math.pow(1-t,3)};
const smooth = t => {t=clamp(t);return t*t*(3-2*t)};
const phase = (t,start,length) => clamp((t-start)/length);
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const portrait = matchMedia('(max-width:620px)');
const MODES = {
intro:{title:'像素汇聚',index:'01 / INTRO',duration:5.6,hint:'像素汇聚 · 剪影浮现 · 字标入场'},
ambient:{title:'渐变涟漪',index:'02 / AMBIENT',duration:4.8,hint:'循环的暖色涟漪，适合待机展示'},
outro:{title:'像素散场',index:'03 / OUTRO',duration:3.6,hint:'字标隐去 · 剪影退场 · 像素消散'}
};
const state={mode:'intro',time:reduce.matches?3.2:0,playing:!reduce.matches,loop:false,rate:1,frame:0,last:null,light:document.body.dataset.theme==='light'};
const pixels=[...document.querySelectorAll('.pixel')].map(el=>{
const x=Number(el.dataset.x),y=Number(el.dataset.y),hex=el.dataset.color;
return {el,x,y,diagonal:(x+256-y)/512,distance:Math.hypot(x+8-128,y+8-128)/170,jitter:((x/16*7+y/16*11)%9)/9,rgb:[1,3,5].map(n=>parseInt(hex.slice(n,n+2),16))};
});
const letters=[...document.querySelectorAll('.letter-motion')];
const faces=[...document.querySelectorAll('.letter-face')];
const presets=[...document.querySelectorAll('[data-mode]')];
function layout(){
$('art').setAttribute('viewBox',portrait.matches?'0 0 340 260':'-15 -25 460 170');
$('icon-layout').setAttribute('x',portrait.matches?'111':'0');
$('icon-layout').setAttribute('y',portrait.matches?'8':'0');
$('wordmark-layout').setAttribute('transform',portrait.matches?'translate(30 165) skewX(-5)':'translate(142 27) skewX(-5)');
$('subtitle-layout').setAttribute('transform',portrait.matches?'translate(62 238)':'translate(174 100)');
$('accent').setAttribute('d',portrait.matches?'M24 234H46':'M136 96H158');
}
function paint(t){
const {mode}=state,duration=MODES[mode].duration;
$('pixel-underlay').style.opacity=String(mode==='intro'?smooth(phase(t,1.65,.25)):mode==='outro'?1-smooth(phase(t,1.12,.23)):1);
for(const p of pixels){
let alpha=1,scale=1,dx=0,dy=0,glow=0;
if(mode==='intro'){
const start=.12+p.diagonal*.95+p.jitter*.13;
const k=ease(phase(t,start,.56));
alpha=smooth(phase(t,start,.22));scale=.4+.6*k;dx=(p.x-120)*.18*(1-k);dy=22*(1-k);
}else if(mode==='ambient'){
const wave=Math.sin(2*Math.PI*(t/duration-p.diagonal));
glow=Math.pow(Math.max(0,wave),5)*.2;
}else{
const start=1.35+(1-p.diagonal)*.9+p.jitter*.14;
const k=smooth(phase(t,start,.65));
alpha=1-k;scale=1-.45*k;dx=12*k;dy=-24*k;
}
p.el.style.opacity=alpha.toFixed(3);
p.el.style.transform=`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${scale.toFixed(3)})`;
p.el.setAttribute('fill',glow?`rgb(${p.rgb.map(c=>Math.round(c+(255-c)*glow)).join(',')})`:p.el.dataset.color);
}
let shovelAlpha=1,shovelY=0;
if(mode==='intro'){const k=ease(phase(t,1.05,.55));shovelAlpha=smooth(phase(t,1.05,.35));shovelY=8*(1-k)}
if(mode==='outro'){const k=smooth(phase(t,.86,.52));shovelAlpha=1-k;shovelY=-5*k}
$('shovel-motion').style.opacity=shovelAlpha.toFixed(3);
$('shovel-motion').setAttribute('transform',`translate(0 ${shovelY.toFixed(2)})`);
letters.forEach((el,i)=>{
let alpha=1,y=0;
if(mode==='intro'){const k=ease(phase(t,1.47+i*.095,.48));alpha=smooth(phase(t,1.47+i*.095,.24));y=9*(1-k)}
if(mode==='outro'){const k=smooth(phase(t,.12+(5-i)*.06,.4));alpha=1-k;y=-6*k}
el.style.opacity=alpha.toFixed(3);el.setAttribute('transform',`translate(0 ${y.toFixed(2)})`);
});
let sub=1;
if(mode==='intro')sub=smooth(phase(t,2.08,.48));
if(mode==='outro')sub=1-smooth(phase(t,.06,.32));
$('subtitle-layout').style.opacity=(sub*.66).toFixed(3);
$('accent').style.opacity=sub.toFixed(3);$('accent').setAttribute('stroke-dashoffset',String(22*(1-sub)));
const value=t/duration*1000;
$('timeline').value=String(value);$('timeline').style.setProperty('--progress',`${value/10}%`);
$('timeline').setAttribute('aria-valuetext',`${t.toFixed(2)} 秒，共 ${duration.toFixed(2)} 秒`);
$('time').textContent=`${t.toFixed(2)} / ${duration.toFixed(2)} s`;
}
function controls(){
$('play').setAttribute('aria-label',state.playing?'暂停动画':'播放动画');
$('play-glyph').setAttribute('d',state.playing?'M8 5V19M16 5V19':'M9 5 19 12 9 19Z');
$('play-glyph').setAttribute('fill',state.playing?'none':'currentColor');
$('status-dot').classList.toggle('paused',!state.playing);
$('status').textContent=state.playing?'播放中':state.time>=MODES[state.mode].duration?'播放结束':'已暂停';
$('loop').checked=state.loop;
}
function cancel(){cancelAnimationFrame(state.frame);state.frame=0;state.last=null}
function tick(now){
if(!state.playing)return;
if(state.last!==null)state.time+=Math.min((now-state.last)/1000,.12)*state.rate;
state.last=now;
const duration=MODES[state.mode].duration;
if(state.time>=duration){
if(state.loop)state.time%=duration;
else{state.time=duration;state.playing=false;controls()}
}
paint(state.time);
if(state.playing)state.frame=requestAnimationFrame(tick);else state.last=null;
}
function play(){if(state.time>=MODES[state.mode].duration)state.time=0;cancel();state.playing=true;controls();state.frame=requestAnimationFrame(tick)}
function pause(){state.playing=false;cancel();controls()}
function replay(){state.time=0;paint(0);play()}
function choose(mode){
pause();state.mode=mode;state.loop=mode==='ambient';state.time=reduce.matches&&mode==='intro'?3.2:0;
presets.forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode)));
$('mode-title').textContent=MODES[mode].title;$('mode-index').textContent=MODES[mode].index;$('stage-hint').textContent=MODES[mode].hint;
$('announcement').textContent=`已选择${MODES[mode].title}`;
paint(state.time);controls();if(!reduce.matches)play();
}
function theme(){
state.light=!state.light;document.body.dataset.theme=state.light?'light':'dark';
$('theme').textContent=state.light?'深色背景':'浅色背景';
faces.forEach((el,i)=>el.setAttribute('fill',i<3?(state.light?'#24262D':'#F9F7F1'):(state.light?'#E85829':'#FF8847')));
$('subtitle-layout').setAttribute('fill',state.light?'#24262D':'#F9F7F1');$('accent').setAttribute('stroke',state.light?'#E85829':'#FF8847');
}
$('play').addEventListener('click',()=>state.playing?pause():play());$('replay').addEventListener('click',replay);
$('timeline').addEventListener('input',e=>{pause();state.time=Number(e.target.value)/1000*MODES[state.mode].duration;paint(state.time);controls()});
$('speed').addEventListener('change',e=>{state.rate=Number(e.target.value)});
$('loop').addEventListener('change',e=>{state.loop=e.target.checked});
$('theme').addEventListener('click',theme);presets.forEach(el=>el.addEventListener('click',()=>choose(el.dataset.mode)));
$('download').href=location.href.split('#')[0];
document.addEventListener('keydown',e=>{if(e.target.closest('button,input,select,a,textarea')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.code==='Space'){e.preventDefault();state.playing?pause():play()}else if(e.code==='KeyR')replay()});
document.addEventListener('visibilitychange',()=>{state.last=null;if(document.hidden){cancelAnimationFrame(state.frame);state.frame=0}else if(state.playing&&!state.frame)state.frame=requestAnimationFrame(tick)});
portrait.addEventListener('change',layout);
reduce.addEventListener('change',()=>{$('reduce-note').hidden=!reduce.matches;if(reduce.matches){pause();state.time=state.mode==='intro'?3.2:0;paint(state.time);controls()}});
$('reduce-note').hidden=!reduce.matches;layout();choose('intro');
})();
</script>
</body></html>
